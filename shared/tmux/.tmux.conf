unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind -n M-h resize-pane -L 10
bind -n M-j resize-pane -D 10
bind -n M-k resize-pane -U 10
bind -n M-l resize-pane -R 10
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Colors: Ghostty (shared/ghostty/config) + simple-bar Stone (themes/stone.js)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",tmux-256color:RGB"

# tmux 3.6: "colour" tints only part of the divider (half-white bug)
set -g pane-border-indicators off

set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-position bottom
set -g status-style "bg=#0a0a0a,fg=#b4bac4"

set -g status-left-length 32
set -g status-right-length 64
set -g status-left "#[fg=#f0f0f0,bold]#S #[fg=#484848]│ "
set -g status-right "#[fg=#6e7684]%H:%M #[fg=#484848]│ #[fg=#909090]%d-%b-%y"

setw -g window-status-format "#[fg=#6e7684] #I:#W "
setw -g window-status-current-format "#[fg=#0a0a0a,bg=#949aa8,bold] #I:#W #[fg=#949aa8,bg=#0a0a0a] "
setw -g window-status-separator ""

set -g pane-border-style "fg=#484848,bg=#0a0a0a"
set -g pane-active-border-style "fg=#949aa8,bg=#0a0a0a"

set -g message-style "bg=#252830,fg=#d8dce4"
set -g message-command-style "bg=#141414,fg=#b4bac4"
set -g mode-style "bg=#484848,fg=#f0f0f0"

